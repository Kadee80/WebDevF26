    <!--
      The layout below needs air between the cards.
      Using PIXELS, add margin to .gallery-inclass or subtract from
      .gallery-item-inclass so this sits in one row of four columns.
      You'll also need display: inline-block on the cards, and you'll
      probably run into the whitespace-gap issue from class -- deal with
      it however you'd like.
      Start from scratch in css/styles.css -- do not copy the earlier rules.
    -->
    <div class="gallery-inclass">
      <div class="gallery-item-inclass"></div>
      <div class="gallery-item-inclass"></div>

      <div class="gallery-item-inclass"></div>
