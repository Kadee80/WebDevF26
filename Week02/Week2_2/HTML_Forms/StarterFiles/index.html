<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Class Cookbook — Submit a Recipe</title>
    <style>
      #top {
        color: red;
      }
    </style>
  </head>
  <body>
    <!-- Command + / to comment in whatever language you are currently writing -->

    <h1>Class Cookbook</h1>
    <p id="top">
      Last class we marked up a recipe as a web page. Today we build the form
      someone would fill out to send us one. For more information see
      <a href="https://www.w3schools.com/html/html_forms.asp" target="_blank"
        >W3 Schools Tutorials</a
      >. Whenever you need to make an anchor tag but you don't have the final
      link/url yet... use the <code>#</code> for your href!
    </p>

    <!-- ============================================================
         THE FORM GOES HERE.

         We build it together, one fieldset at a time:

           1. Who is cooking?   text, email, password
           2. The recipe        text, number, range, select
           3. How hard is it?   radio    (one answer only)
           4. Dietary tags      checkbox (several answers)
           5. The actual food   textarea
           6. Extras            file, url, date, color
           7. Buttons           submit, reset

         Start with the <form> tag itself and its attributes, then add
         one fieldset at a time. Do not skip ahead -- the point is to
         watch what each input type does in the browser as we add it.
         ============================================================ -->

    <p><a href="#top">Back to Top</a></p>
  </body>
</html>
