<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Show Page</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Week 09's finished page, plus three controls that do nothing yet:
         a quantity stepper, a promo code box, and a Roll again button.
         Today we make all three work. -->

    <article class="ticket">
      <header class="poster">
        <p class="presents">The Fillmore East presents</p>
        <h1 class="billing" id="billing"></h1>
        <p class="where-when" id="where-when"></p>
      </header>

      <p class="status" id="status"></p>

      <section class="order">
        <h2>Your order</h2>

        <p class="line" id="price-line"></p>
        <p class="line" id="fee-line"></p>
        <p class="line discount" id="discount-line"></p>
        <p class="line discount" id="promo-line"></p>

        <p class="total">
          <span>Total</span>
          <strong id="total"></strong>
        </p>

        <p class="fine-print" id="fine-print"></p>
      </section>

      <!-- NEW: none of this is wired up yet -->
      <section class="controls">
        <div class="qty">
          <span class="qty-label">Tickets</span>
          <button id="minus" type="button" aria-label="One fewer ticket">−</button>
          <span class="count" id="count"></span>
          <button id="plus" type="button" aria-label="One more ticket">+</button>
        </div>

        <div class="promo">
          <label for="promo">Promo code</label>
          <input id="promo" type="text" placeholder="Try FRIEND" />
          <p class="promo-msg" id="promo-msg"></p>
        </div>

        <button class="roll" id="roll" type="button">Roll a different show</button>
      </section>

      <section class="lineup-wrap">
        <h2>Running order</h2>
        <ul class="lineup" id="lineup"></ul>
        <p class="tagline" id="tagline"></p>
      </section>
    </article>

    <script>
      /* ---------- Where Week 09 ended ----------
         The facts are random, the rules work them out, and all of it
         happens exactly once: when the page loads. Today that changes. */

      const headliners = ['Bad Moon Rising', 'Velvet Static', 'Dial Tone', 'Mountain Time', 'Kerosene Club', 'The Paper Cuts']
      const supports = ['Low Ceiling', 'The Ferry Lights', 'Tiny Mirrors', 'Garden State Radio']
      const djs = ['DJ Shortwave', 'DJ Halfmoon', 'DJ Ferry']
      const venues = ['The Fillmore East', 'Rough Trade', 'Brooklyn Steel', 'Market Hotel']
      const nights = ['Thu 12 Nov', 'Fri 13 Nov', 'Sat 14 Nov']
      const accents = ['#e0504f', '#2f6f4e', '#3b4c9c', '#b4622a', '#6b3f7a']
      const taglines = ['Strictly 18+. No re-entry.', 'Late set. Bring earplugs.', 'All ages until 10pm.', 'Sold out three times running.']

      function pickRandom(list) {
        return list[Math.floor(Math.random() * list.length)]
      }

      function randomBetween(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min
      }

      const headliner = pickRandom(headliners)
      const support = pickRandom(supports)
      const venue = pickRandom(venues)
      const doors = `${pickRandom(nights)}, doors 8pm`

      const ticketPrice = randomBetween(12, 45) + 0.5
      const capacity = randomBetween(120, 400)
      const ticketsSold = randomBetween(capacity - 25, capacity)
      const serviceFeeRate = 0.12
      const studentPrice = 5
      const isStudent = true

      let quantity = randomBetween(1, 4)

      const ticketsLeft = capacity - ticketsSold
      const isSoldOut = ticketsLeft === 0
      const isAlmostSoldOut = ticketsLeft < 10

      const subtotal = ticketPrice * quantity
      const serviceFee = subtotal * serviceFeeRate
      const discount = isStudent ? studentPrice : 0
      const total = subtotal + serviceFee - discount

      let status

      if (isSoldOut) {
        status = 'Sold out — join the waiting list'
      } else if (isAlmostSoldOut) {
        status = `Hurry — only ${ticketsLeft} tickets left`
      } else {
        status = 'Tickets available'
      }

      const lineup = [pickRandom(djs), support, headliner]
      let lineupHTML = ''

      for (let i = 0; i < lineup.length; i++) {
        const stripe = i % 2 === 0 ? 'stripe' : ''
        lineupHTML += `<li class="${stripe}"><span class="time">${8 + i}pm</span>${lineup[i]}</li>`
      }

      document.querySelector('#billing').textContent = `${headliner.toUpperCase()} + ${support}`
      document.querySelector('#where-when').textContent = `${venue} · ${doors}`
      document.querySelector('#status').textContent = status
      document.querySelector('#price-line').textContent = `${quantity} × $${ticketPrice.toFixed(2)}  —  $${subtotal.toFixed(2)}`
      document.querySelector('#fee-line').textContent = `Service fee  —  $${serviceFee.toFixed(2)}`
      document.querySelector('#discount-line').textContent = isStudent ? `Student discount  —  −$${discount.toFixed(2)}` : ''
      document.querySelector('#total').textContent = `$${total.toFixed(2)}`
      document.querySelector('#fine-print').textContent = `${ticketsLeft} of ${capacity} tickets remaining`
      document.querySelector('#count').textContent = quantity
      document.querySelector('#lineup').innerHTML = lineupHTML
      document.querySelector('#tagline').textContent = pickRandom(taglines)
      document.body.style.setProperty('--accent', pickRandom(accents))

      /* ---------- Today's code goes below this line ---------- */
    </script>
  </body>
</html>
